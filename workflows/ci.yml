name: CI - Build & Push Docker Image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-train.txt pytest==8.3.4 httpx==0.28.1

      - name: Unit tests (API + model)
        run: pytest -q tests

      - name: Model quality gate (MNIST test set)
        run: |
          python evaluate.py model/mnist_mlp.npz | tee eval.json
          python -c "import json; r=json.load(open('eval.json'))[0]; print(r); assert r['test_acc'] >= 0.97, 'accuracy below 97%'"
          echo "### Model evaluation" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat model/model_info.json >> $GITHUB_STEP_SUMMARY
          cat eval.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  docker-build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mnist-digit-recognizer:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mnist-digit-recognizer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
